<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suma Group — Employee ID Card Approval</title>
<style>
  :root{
    --teal:#2a7776; --teal-dk:#1e5b5a; --teal-lt:#e4eded;
    --gold:#e5af2b; --gold-dk:#b8860b;
    --ink:#231f20; --muted:#6b7280;
    --bg:#f4f6f6; --panel:#ffffff; --line:#e3e8e8;
    --ok:#177a4c; --ok-bg:#e7f4ed;
    --warn:#a35a06; --warn-bg:#fdf1e0;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --teal:#3d9d9b; --teal-dk:#2a7776; --teal-lt:#17302f;
      --ink:#e8eceb; --muted:#9aa5a4;
      --bg:#0f1717; --panel:#151f1f; --line:#243333;
      --ok:#5cc48d; --ok-bg:#13301f;
      --warn:#e0a557; --warn-bg:#312312;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,textarea,select{font:inherit; color:inherit}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:30;
    background:var(--panel); border-bottom:1px solid var(--line);
    padding:10px 18px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:11px; margin-right:auto}
  /* the mark is cut from the ID artwork with a transparent background, so the
     white channel of the S curve comes from the tile underneath — keep it white */
  .mark{
    background:#fff;border-radius:10px;flex:none;
    padding:6px 8px;display:grid;place-items:center;
    box-shadow:0 0 0 1px var(--line);
  }
  .mark img{height:30px;width:auto;display:block}
  .brand h1{margin:0;font-size:16px;letter-spacing:.2px}
  .brand p{margin:0;font-size:12.5px;color:var(--muted)}
  .who{display:flex;align-items:center;gap:8px}
  .who label{font-size:12.5px;color:var(--muted)}
  .who input{
    width:170px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--bg);
  }
  .who input:focus{outline:2px solid var(--teal);outline-offset:1px}

  .stats{display:flex;align-items:center;gap:14px}
  .bar{width:150px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .3s}
  .stats b{font-variant-numeric:tabular-nums}
  .stats .sub{font-size:12.5px;color:var(--muted)}

  .btn{
    padding:8px 13px;border:1px solid var(--line);background:var(--panel);
    border-radius:9px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
  .btn.primary:hover{background:var(--teal-dk);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .menu{position:relative}
  .menu>div{
    position:absolute;right:0;top:calc(100% + 6px);min-width:230px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--shadow);padding:6px;display:none;
  }
  .menu.open>div{display:block}
  .menu button, .menu label{
    display:block;width:100%;text-align:left;padding:9px 11px;border:0;border-radius:8px;
    background:none;cursor:pointer;font-size:13.5px;
  }
  .menu button:hover, .menu label:hover{background:var(--teal-lt)}
  .menu hr{border:0;border-top:1px solid var(--line);margin:5px 2px}

  /* ---------- layout ---------- */
  main{display:grid;grid-template-columns:320px 1fr;gap:18px;padding:18px;align-items:start}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* ---------- sidebar ---------- */
  aside{position:sticky;top:76px;max-height:calc(100vh - 94px);display:flex;flex-direction:column;overflow:hidden}
  .search{padding:12px 12px 8px}
  .search input{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  }
  .search input:focus{outline:2px solid var(--teal);outline-offset:1px}
  .tabs{display:flex;gap:6px;padding:0 12px 10px;flex-wrap:wrap}
  .tab{
    padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:none;
    font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)
  }
  .tab[aria-selected="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
  ul.list{list-style:none;margin:0;padding:0 8px 10px;overflow:auto;flex:1}
  ul.list li{margin-bottom:2px}
  ul.list button{
    width:100%;display:flex;align-items:center;gap:10px;text-align:left;
    padding:9px 10px;border:0;border-radius:10px;background:none;cursor:pointer;
  }
  ul.list button:hover{background:var(--teal-lt)}
  ul.list button[aria-current="true"]{background:var(--teal-lt);box-shadow:inset 0 0 0 1px var(--teal)}
  .dot{width:9px;height:9px;border-radius:99px;flex:none;background:var(--line)}
  .dot.approved{background:var(--ok)}
  .dot.correction{background:var(--gold-dk)}
  .li-txt{min-width:0;flex:1}
  .li-txt strong{display:block;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .li-txt span{font-size:12px;color:var(--muted)}
  .empty{padding:22px 14px;color:var(--muted);font-size:13.5px;text-align:center}

  /* ---------- card view ---------- */
  section.view{padding:20px 22px 24px}
  .view-grid{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start}
  .cardwrap{text-align:center}
  .cardwrap img{
    width:100%;max-width:300px;border-radius:14px;display:block;
    box-shadow:0 2px 6px rgba(16,24,40,.12), 0 16px 40px rgba(16,24,40,.14);
  }
  .cardwrap a{display:inline-block;margin-top:12px;font-size:13px;color:var(--teal);font-weight:600}
  h2{margin:0 0 2px;font-size:22px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 16px}
  dl.facts{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0 0 20px;font-size:14px}
  dl.facts dt{color:var(--muted)}
  dl.facts dd{margin:0;font-weight:600}

  .status{
    display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
    font-size:12.5px;font-weight:700;margin-bottom:16px;
    background:var(--line);color:var(--muted)
  }
  .status.approved{background:var(--ok-bg);color:var(--ok)}
  .status.correction{background:var(--warn-bg);color:var(--warn)}

  .approve{
    display:flex;gap:12px;align-items:flex-start;padding:14px 16px;
    border:1.5px solid var(--line);border-radius:12px;cursor:pointer;margin-bottom:16px;
    background:var(--bg);
  }
  .approve:hover{border-color:var(--teal)}
  .approve.on{border-color:var(--ok);background:var(--ok-bg)}
  .approve input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--ok);flex:none;cursor:pointer}
  .approve strong{display:block;font-size:15px}
  .approve span{font-size:13px;color:var(--muted)}

  .field label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
  .field .hint{font-weight:400;color:var(--muted);font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .chip{
    padding:5px 10px;border-radius:99px;border:1px dashed var(--line);background:none;
    font-size:12.5px;cursor:pointer;color:var(--muted)
  }
  .chip:hover{border-style:solid;border-color:var(--teal);color:var(--teal)}
  textarea{
    width:100%;min-height:110px;padding:11px 13px;border:1px solid var(--line);
    border-radius:11px;background:var(--bg);resize:vertical;
  }
  textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
  .actions{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .saved{font-size:13px;color:var(--ok);opacity:0;transition:opacity .2s}
  .saved.show{opacity:1}

  /* ---------- live team view ---------- */
  .live-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .live-head h2{margin:0;flex:1}
  .live-note{font-size:13px;color:var(--muted);margin:0 0 16px}
  table.live{width:100%;border-collapse:collapse;font-size:13.5px}
  table.live th{
    text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap;
  }
  table.live td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
  table.live tr:hover td{background:var(--teal-lt)}
  table.live td.who{font-weight:600;cursor:pointer}
  table.live td.who:hover{color:var(--teal)}
  .pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .pill.approved{background:var(--ok-bg);color:var(--ok)}
  .pill.correction{background:var(--warn-bg);color:var(--warn)}
  .pill.pending{background:var(--line);color:var(--muted)}
  .tablewrap{overflow-x:auto}

  /* ---------- new-entry form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-bottom:18px}
  .form-grid .wide{grid-column:1 / -1}
  .form-grid label{display:block;font-weight:600;font-size:13.5px;margin-bottom:5px}
  .form-grid .req{color:var(--gold-dk)}
  .form-grid input, .form-grid select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  }
  .form-grid input:focus, .form-grid select:focus{outline:2px solid var(--teal);outline-offset:1px}
  .form-grid input.bad{border-color:#c0392b}
  .dot.new{background:var(--teal)}
  .pill.new{background:var(--teal-lt);color:var(--teal)}
  .photo{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
  .photo-drop{
    flex:1;border:1.5px dashed var(--line);border-radius:12px;padding:16px;
    background:var(--bg);cursor:pointer;display:block;
  }
  .photo-drop:hover, .photo-drop.over{border-color:var(--teal);border-style:solid}
  .photo-drop strong{display:block;font-size:14px;margin-bottom:3px}
  .photo-drop span{font-size:12.5px;color:var(--muted)}
  .photo-prev{
    width:96px;height:124px;border-radius:8px;object-fit:cover;flex:none;
    border:2px solid var(--teal);background:var(--panel);
  }
  .photo-meta{font-size:12.5px;color:var(--muted);margin-top:7px}
  .photo-meta button{
    border:0;background:none;color:var(--teal);font-weight:600;cursor:pointer;padding:0;font-size:12.5px;
  }
  @media (max-width:620px){ .form-grid{grid-template-columns:1fr} }

  .placeholder{padding:52px 20px 60px;text-align:center;color:var(--muted)}
  .placeholder h2{color:var(--ink);margin-bottom:8px}
  .placeholder p{max-width:430px;margin:0 auto}
  .lockup{
    background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);
    display:inline-grid;place-items:center;padding:20px 26px;margin-bottom:26px;
  }
  .lockup img{height:92px;width:auto;display:block}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;
    font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;
  }
  .toast.show{opacity:1;transform:translateX(-50%)}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  @media (max-width:900px){
    main{grid-template-columns:1fr;padding:12px;gap:12px}
    aside{position:static;max-height:none}
    ul.list{max-height:44vh}
    .view-grid{grid-template-columns:1fr}
    .cardwrap img{margin:0 auto}
    .brand{width:100%}
    .stats{order:3}
  }
  @media print{
    header,aside,.approve,.chips,.actions,.toast{display:none!important}
    main{display:block;padding:0}
    .panel{border:0;box-shadow:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="mark"><img src="__MARK__" alt="Suma Group"></div>
    <div>
      <h1>Employee ID Card Approval</h1>
      <p>Suma Group &middot; check your card, then approve or request a correction</p>
    </div>
  </div>

  <div class="who">
    <label for="reviewer">Reviewed by</label>
    <input id="reviewer" placeholder="Your name" autocomplete="name">
  </div>

  <div class="stats">
    <div class="bar"><i id="barFill"></i></div>
    <div>
      <b id="statCount">0 / 0</b>
      <div class="sub" id="statBreak">reviewed</div>
    </div>
  </div>

  <button class="btn" id="newBtn">+ New ID card</button>
  <button class="btn" id="liveBtn" hidden>Team responses</button>

  <div class="menu" id="menu">
    <button class="btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Export &amp; tools &#9662;</button>
    <div role="menu">
      <button data-act="xlsx">Download responses (Excel)</button>
      <button data-act="csv">Download responses (CSV)</button>
      <button data-act="json">Download responses (JSON)</button>
      <hr>
      <button data-act="copyMine">Copy my response as text</button>
      <button data-act="copyCorrections">Copy correction list for designer</button>
      <hr>
      <label>Merge responses (JSON)&hellip;<input type="file" id="importFile" accept=".json,application/json" multiple hidden></label>
      <button data-act="reset">Clear all responses on this device</button>
    </div>
  </div>
</header>

<main>
  <aside class="panel">
    <div class="search">
      <label class="sr" for="q">Search employees</label>
      <input id="q" type="search" placeholder="Search name, ID or designation" autocomplete="off">
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-filter="all" aria-selected="true">All <span data-count="all"></span></button>
      <button class="tab" role="tab" data-filter="pending" aria-selected="false">Pending <span data-count="pending"></span></button>
      <button class="tab" role="tab" data-filter="approved" aria-selected="false">Approved <span data-count="approved"></span></button>
      <button class="tab" role="tab" data-filter="correction" aria-selected="false">Corrections <span data-count="correction"></span></button>
      <button class="tab" role="tab" data-filter="new" aria-selected="false">New <span data-count="new"></span></button>
    </div>
    <ul class="list" id="list"></ul>
  </aside>

  <section class="panel view" id="view"></section>
</main>

<div class="toast" id="toast"></div>

<script>

</script>

/*__DATA__*/
</script>

<script>
(function () {
  'use strict';
  var EMP = window.__EMPLOYEES__ || [];
  var LOCKUP = window.__LOCKUP__ || '';
  var SYNC = window.__SYNC__ || null;   // {url, token} — absent until the Sheet is connected
  var KEY = 'sis_id_approval_v1';
  var state = load();
  var filter = 'all';
  var query = '';
  var currentId = null;
  var saveTimer = null;
  var mode = 'card';                    // 'card' | 'live'
  var live = { rows: null, loading: false, error: '', at: null };

  function load() {
    try {
      var raw = JSON.parse(localStorage.getItem(KEY) || '{}');
      return { reviewer: raw.reviewer || '', responses: raw.responses || {}, newEntries: raw.newEntries || [] };
    } catch (e) { return { reviewer: '', responses: {}, newEntries: [] }; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) {
      var heavy = state.newEntries.some(function (n) { return n.photo; });
      toast(heavy
        ? 'This device is out of space — send the request to HR, then remove the photo'
        : 'Could not save on this device (storage blocked)');
    }
  }
  function resp(id) {
    return state.responses[id] || { approved: false, remarks: '', by: '', at: '' };
  }
  function statusOf(id) {
    var r = resp(id);
    if (r.approved) return 'approved';
    if ((r.remarks || '').trim()) return 'correction';
    return 'pending';
  }
  function label(s) {
    return s === 'approved' ? 'Approved' : s === 'correction' ? 'Correction requested' : 'Not reviewed yet';
  }

  /* ---------- header stats ---------- */
  function renderStats() {
    var counts = { all: EMP.length + state.newEntries.length, pending: 0, approved: 0, correction: 0, 'new': state.newEntries.length };
    EMP.forEach(function (e) { counts[statusOf(e.id)]++; });
    var done = counts.approved + counts.correction;
    document.getElementById('barFill').style.width = (EMP.length ? done / EMP.length * 100 : 0) + '%';
    document.getElementById('statCount').textContent = done + ' / ' + EMP.length;
    document.getElementById('statBreak').textContent =
      counts.approved + ' approved · ' + counts.correction + ' correction' + (counts.correction === 1 ? '' : 's');
    Object.keys(counts).forEach(function (k) {
      var el = document.querySelector('[data-count="' + k + '"]');
      if (el) el.textContent = '(' + counts[k] + ')';
    });
  }

  /* ---------- sidebar ---------- */
  // the sidebar mixes the 50 printed cards with any manually added requests
  function listRows() {
    var rows = EMP.map(function (e) {
      return { kind: 'card', key: e.id, name: e.name, sub: e.id + ' · ' + e.office, status: statusOf(e.id), emp: e };
    });
    state.newEntries.forEach(function (n) {
      rows.push({
        kind: 'new', key: n.ref, name: n.name,
        sub: (n.empId || 'new entry') + ' · ' + n.office, status: 'new', entry: n
      });
    });
    return rows;
  }
  function matches(r) {
    if (filter !== 'all' && r.status !== filter) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return (r.name + ' ' + r.sub + ' ' + (r.emp ? r.emp.designation : r.entry.designation)).toLowerCase().indexOf(q) > -1;
  }
  function renderList() {
    var ul = document.getElementById('list');
    var rows = listRows().filter(matches);
    ul.innerHTML = '';
    if (!rows.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No one matches that search.';
      ul.appendChild(li);
      return;
    }
    rows.forEach(function (r) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-current', r.key === currentId ? 'true' : 'false');
      b.onclick = function () { r.kind === 'new' ? openNew(r.entry) : open(r.key); };
      var dot = document.createElement('span');
      dot.className = 'dot ' + r.status;
      dot.title = r.status === 'new' ? 'New ID card request' : label(r.status);
      var txt = document.createElement('span');
      txt.className = 'li-txt';
      var strong = document.createElement('strong');
      strong.textContent = r.name;
      var span = document.createElement('span');
      span.textContent = r.sub;
      txt.appendChild(strong); txt.appendChild(span);
      b.appendChild(dot); b.appendChild(txt);
      li.appendChild(b);
      ul.appendChild(li);
    });
  }

  /* ---------- card view ---------- */
  var TAGS = [
    ['Name spelling', 'Name spelling should be: '],
    ['Designation', 'Designation should be: '],
    ['Blood group', 'Blood group should be: '],
    ['ID number', 'ID number should be: '],
    ['Photo', 'Please replace the photo. '],
    ['Office/branch', 'Office / branch should be: ']
  ];

  function open(id) {
    mode = 'card';
    currentId = id;
    if (history.replaceState) history.replaceState(null, '', '#' + id);
    render();
    if (window.innerWidth <= 900) document.getElementById('view').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  /* ---------- manually added ID card requests ---------- */
  var BLOODS = ['A+ve', 'A-ve', 'B+ve', 'B-ve', 'AB+ve', 'AB-ve', 'O+ve', 'O-ve'];
  var OFFICES = ['Dhaka', 'Sylhet', 'Moulvibazar', 'Habiganj', 'Other'];
  var draft = null;

  function openNew(entry) {
    mode = 'new';
    currentId = entry ? entry.ref : null;
    draft = entry
      ? JSON.parse(JSON.stringify(entry))
      : { ref: 'NEW-' + Math.random().toString(36).slice(2, 8).toUpperCase(),
          name: '', empId: '', designation: '', blood: '', office: 'Dhaka',
          remarks: '', by: state.reviewer || '', at: '', sent: '' };
    renderView();
  }

  function renderNew() {
    var view = document.getElementById('view');
    var existing = state.newEntries.filter(function (n) { return n.ref === draft.ref; })[0];
    if (existing) draft = JSON.parse(JSON.stringify(existing));   // stay in step with what was saved
    view.innerHTML = '';

    var h2 = document.createElement('h2');
    h2.textContent = existing ? 'New ID card request' : 'Request a new ID card';
    var sub = document.createElement('p');
    sub.className = 'sub';
    sub.textContent = existing
      ? 'Ref ' + draft.ref + (draft.at ? ' · saved ' + new Date(draft.at).toLocaleString() : '')
      : 'For someone who has joined since the cards were printed, or whose details changed enough to need a fresh card.';
    view.appendChild(h2); view.appendChild(sub);

    var grid = document.createElement('div');
    grid.className = 'form-grid';

    function field(key, labelText, opts) {
      opts = opts || {};
      var wrap = document.createElement('div');
      if (opts.wide) wrap.className = 'wide';
      var lab = document.createElement('label');
      lab.setAttribute('for', 'f_' + key);
      lab.innerHTML = labelText + (opts.required ? ' <span class="req">*</span>' : '');
      var input;
      if (opts.choices) {
        input = document.createElement('select');
        if (!opts.required) input.appendChild(new Option('—', ''));
        opts.choices.forEach(function (c) { input.appendChild(new Option(c, c)); });
      } else {

  /* ---------- passport photo upload ---------- */
  var PHOTO_MAX = 1500;     // long edge, px — ~5x the printed size, so plenty of headroom
  var PHOTO_QUALITY = 0.88;

  // Any size can be uploaded — a 12 MP phone photo is fine. It is resized here
  // rather than rejected, which keeps the POST small and localStorage under its
  // ~5 MB ceiling while staying well above what an ID card needs in print.
  function shrinkPhoto(file, cb) {
    if (!/^image\//.test(file.type)) return cb('That file is not an image');
    var reader = new FileReader();
    reader.onerror = function () { cb('Could not read that file'); };
    reader.onload = function () {
      var img = new Image();
      img.onerror = function () { cb('That image could not be opened'); };
      img.onload = function () {
        var scale = Math.min(1, PHOTO_MAX / Math.max(img.width, img.height));
        var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        try {
          cb(null, { data: canvas.toDataURL('image/jpeg', PHOTO_QUALITY), w: w, h: h, name: file.name });
        } catch (err) { cb('That image could not be processed'); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

    var wrap = document.createElement('div');

    input.hidden = true;

    function paint() {
      wrap.innerHTML = '';
      if (draft.photo) {
        var prev = document.createElement('img');
        prev.className = 'photo-prev';
        prev.src = draft.photo;
        prev.alt = 'Uploaded photo';

      }
      var col = document.createElement('div');

      drop.innerHTML = '';

      strong.textContent = draft.photo ? 'Replace photo' : 'Upload a passport photo';

      span.textContent = draft.photo

        : 'Click to choose a picture, or drag one here. Any size — a full phone photo is fine, it is resized for you.';
      drop.appendChild(strong); drop.appendChild(span); drop.appendChild(input);

    function take(file) {
      if (!file) return;
      shrinkPhoto(file, function (err, out) {
        if (err) return toast(err);
        draft.photo = out.data;
        draft.photoName = out.name;

    input.onchange = function () { take(this.files && this.files[0]); this.value = ''; };
    drop.addEventListener('dragover', function (ev) { ev.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (ev) {
      ev.preventDefault(); drop.classList.remove('over');
      take(ev.dataTransfer.files && ev.dataTransfer.files[0]);

    paint();
    return wrap;
  }

  function commit(id, patch) { update(id, patch); }
  function update(id, patch) {
    var r = resp(id);
    var next = {
      approved: 'approved' in patch ? !!patch.approved : r.approved,
      remarks: 'remarks' in patch ? patch.remarks : r.remarks,
      by: state.reviewer || r.by || '',
      at: new Date().toISOString()
    };
    if (!next.approved && !(next.remarks || '').trim()) delete state.responses[id];
    else state.responses[id] = next;
    persist();
    renderStats(); renderList(); refreshBadge(id);
  }
  // keeps the badge honest while the user is still typing in the remarks box,
  // without re-rendering the view out from under the caret
  function refreshBadge(id) {
    var badge = document.getElementById('statusBadge');
    if (!badge || id !== currentId) return;
    var st = statusOf(id), at = resp(id).at;
    badge.className = 'status ' + st;
    badge.textContent = label(st) + (at ? ' · ' + new Date(at).toLocaleString() : '');
  }
  function queueSave(id, remarks) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { update(id, { remarks: remarks }); flash(); }, 500);
  }
  function flash() {
    var el = document.getElementById('savedMsg');
    if (!el) return;
    el.classList.add('show');
    setTimeout(function () { el.classList.remove('show'); }, 1400);
  }
  function render() { renderStats(); renderList(); renderView(); }

  /* ---------- export / import ---------- */
  function rows() {
    var out = EMP.map(function (e) {
      var r = resp(e.id);
      return {
        employee_id: e.id, name: e.name, designation: e.designation,
        blood_group: e.blood, office: e.office,
        status: statusOf(e.id), approved: r.approved ? 'Yes' : 'No',
        remarks: (r.remarks || '').replace(/\s*\n\s*/g, ' | ').trim(),
        reviewed_by: r.by || '', reviewed_at: r.at || ''
      };
    });
    state.newEntries.forEach(function (n) {
      out.push({
        employee_id: n.empId || n.ref, name: n.name, designation: n.designation,
        blood_group: n.blood, office: n.office,
        status: 'new card requested', approved: 'No',
        remarks: (n.remarks || '').replace(/\s*\n\s*/g, ' | ').trim(),
        reviewed_by: n.by || '', reviewed_at: n.at || ''
      });
    });
    return out;
  }
  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime + ';charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }
  function stamp() { return new Date().toISOString().slice(0, 10); }
  function csvCell(v) {
    v = String(v == null ? '' : v);
    return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  /* ---------- Excel ---------- */
  function saveWorkbook(name, sheets) {
    if (!window.XLSX) return toast('Excel export is unavailable in this copy');
    var bytes = window.XLSX.buildXlsx(sheets);
    var blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Excel workbook downloaded');
  }

  function summarySheet(counts, total, source) {
    return {
      name: 'Summary',
      columns: [{ title: 'Suma Group — ID card approvals', width: 34 }, { title: '', width: 18 }],
      rows: [
        ['Generated', new Date().toLocaleString()],
        ['Source', source],
        ['Prepared by', state.reviewer || '—'],
        [],
        ['Employees on the printed sheet', String(total)],
        ['Approved', String(counts.approved)],
        ['Correction requested', String(counts.correction)],
        ['Not answered yet', String(counts.pending)],
        ['New ID cards requested', String(counts['new'] || 0)]
      ]
    };
  }

  var RESP_COLS = [
    { title: 'Employee ID', width: 13 }, { title: 'Name', width: 32 }, { title: 'Designation', width: 32 },
    { title: 'Blood group', width: 12 }, { title: 'Office', width: 14 }, { title: 'Status', width: 20 },
    { title: 'Approved', width: 10 }, { title: 'Remarks / corrections', width: 52 },
    { title: 'Answered by', width: 22 }, { title: 'When', width: 22 }
  ];
  var NEW_COLS = [
    { title: 'Ref', width: 14 }, { title: 'Employee ID', width: 13 }, { title: 'Name', width: 32 },
    { title: 'Designation', width: 32 }, { title: 'Blood group', width: 12 }, { title: 'Office', width: 14 },
    { title: 'Notes for HR', width: 46 }, { title: 'Photo', width: 34 },
    { title: 'Requested by', width: 22 }, { title: 'When', width: 22 }
  ];
  function when(v) { return v ? new Date(v).toLocaleString() : ''; }

  // workbook from what is saved on this device
  function exportXlsx() {
    var counts = { approved: 0, correction: 0, pending: 0, 'new': state.newEntries.length };
    EMP.forEach(function (e) { counts[statusOf(e.id)]++; });
    var respRows = EMP.map(function (e) {
      var r = resp(e.id), st = statusOf(e.id);
      return [e.id, e.name, e.designation, e.blood, e.office,
        st === 'correction' ? 'Correction requested' : st === 'approved' ? 'Approved' : 'Not answered',
        r.approved ? 'Yes' : 'No', r.remarks || '', r.by || '', when(r.at)];
    });
    var newRows = state.newEntries.map(function (n) {
      return [n.ref, n.empId || '', n.name, n.designation, n.blood, n.office,
        n.remarks || '', n.photo ? 'attached, sent to HR' : '', n.by || '', when(n.at)];
    });
    saveWorkbook('SIS-ID-approvals-' + stamp() + '.xlsx', [
      summarySheet(counts, EMP.length, 'this device'),
      { name: 'Responses', columns: RESP_COLS, rows: respRows },
      { name: 'New requests', columns: NEW_COLS, rows: newRows }
    ]);
  }

  // workbook from everything the team has sent in
  function exportLiveXlsx(byId) {
    var counts = { approved: 0, correction: 0, pending: 0, 'new': (live.news || []).length };
    var respRows = EMP.map(function (e) {
      var r = byId[e.id];
      var st = r ? (r.approved ? 'approved' : (r.remarks || '').trim() ? 'correction' : 'pending') : 'pending';
      counts[st]++;
      return [e.id, e.name, e.designation, e.blood, e.office,
        st === 'correction' ? 'Correction requested' : st === 'approved' ? 'Approved' : 'Not answered',
        r && r.approved ? 'Yes' : 'No', r ? r.remarks || '' : '', r ? r.by || '' : '', when(r && r.at)];
    });
    var newRows = (live.news || []).map(function (n) {
      return [n.ref, n.empId || '', n.name, n.designation, n.blood, n.office,
        n.remarks || '', n.photo || '', n.by || '', when(n.at)];
    });
    saveWorkbook('SIS-ID-team-responses-' + stamp() + '.xlsx', [
      summarySheet(counts, EMP.length, 'everyone who has answered'),
      { name: 'Responses', columns: RESP_COLS, rows: respRows },
      { name: 'New requests', columns: NEW_COLS, rows: newRows }
    ]);
  }

  function exportCsv() {
    var data = rows();
    var head = Object.keys(data[0]);
    var body = data.map(function (r) { return head.map(function (h) { return csvCell(r[h]); }).join(','); });
    download('SIS-ID-approvals-' + stamp() + '.csv', '﻿' + head.join(',') + '\n' + body.join('\n'), 'text/csv');
  }
  function exportJson() {
    download('SIS-ID-approvals-' + (state.reviewer ? state.reviewer.replace(/[^\w]+/g, '-') + '-' : '') + stamp() + '.json',
      JSON.stringify({ app: 'sis_id_approval_v1', reviewer: state.reviewer, exported: new Date().toISOString(),
        responses: state.responses, newEntries: state.newEntries }, null, 2),
      'application/json');
  }
  function copy(text, msg) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { fallback(); });
    } else fallback();
    function fallback() {
      var t = document.createElement('textarea');
      t.value = text; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); toast(msg); } catch (e) { toast('Copy failed — select the text manually'); }
      t.remove();
    }
  }
  function copyMine() {
    if (!currentId) return toast('Open your card first');
    var e = EMP.filter(function (x) { return x.id === currentId; })[0];
    var r = resp(e.id), st = statusOf(e.id);
    copy('Suma Group ID card review\n' + e.name + ' (' + e.id + ')\n' +
      'Status: ' + label(st) + '\n' +
      (r.remarks ? 'Corrections: ' + r.remarks + '\n' : '') +
      (state.reviewer ? 'Reviewed by: ' + state.reviewer + '\n' : ''), 'Response copied — paste it to HR');
  }
  function copyCorrections() {
    var list = EMP.filter(function (e) { return statusOf(e.id) === 'correction'; });
    if (!list.length) return toast('No corrections recorded yet');
    copy('ID card corrections — ' + new Date().toLocaleDateString() + '\n\n' +
      list.map(function (e, i) {
        return (i + 1) + '. ' + e.name + ' (' + e.id + ')\n   ' + resp(e.id).remarks.replace(/\n/g, '\n   ');
      }).join('\n\n'), list.length + ' correction(s) copied');
  }
  function importFiles(files) {
    var pending = files.length, merged = 0;
    Array.prototype.forEach.call(files, function (f) {
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var d = JSON.parse(fr.result);
          var rs = d.responses || {};
          Object.keys(rs).forEach(function (id) {
            var incoming = rs[id], have = state.responses[id];
            if (!have || (incoming.at || '') >= (have.at || '')) { state.responses[id] = incoming; merged++; }
          });
          (d.newEntries || []).forEach(function (n) {
            var at = state.newEntries.map(function (x) { return x.ref; }).indexOf(n.ref);
            if (at < 0) { state.newEntries.push(n); merged++; }
            else if ((n.at || '') > (state.newEntries[at].at || '')) { state.newEntries[at] = n; merged++; }
          });
        } catch (e) { toast('Could not read ' + f.name); }
        if (!--pending) { persist(); render(); toast(merged + ' response(s) merged'); }
      };
      fr.readAsText(f);
    });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- wiring ---------- */
  var reviewer = document.getElementById('reviewer');
  reviewer.value = state.reviewer;
  reviewer.oninput = function () { state.reviewer = reviewer.value.trim(); persist(); };

  document.getElementById('q').oninput = function () { query = this.value.trim(); renderList(); };

  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tab) {
    tab.onclick = function () {
      filter = tab.dataset.filter;
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
        t.setAttribute('aria-selected', String(t === tab));
      });
      renderList();
    };
  });

  var menu = document.getElementById('menu'), menuBtn = document.getElementById('menuBtn');
  menuBtn.onclick = function (ev) {
    ev.stopPropagation();
    menu.classList.toggle('open');
    menuBtn.setAttribute('aria-expanded', String(menu.classList.contains('open')));
  };
  document.addEventListener('click', function () {
    menu.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  });
  menu.querySelector('[role="menu"]').addEventListener('click', function (ev) {
    var act = ev.target.dataset && ev.target.dataset.act;
    if (!act) return;
    menu.classList.remove('open');
    if (act === 'xlsx') exportXlsx();
    else if (act === 'csv') exportCsv();
    else if (act === 'json') exportJson();
    else if (act === 'copyMine') copyMine();
    else if (act === 'copyCorrections') copyCorrections();
    else if (act === 'reset') {
      if (confirm('Delete every response saved in this browser? This cannot be undone.')) {
        state.responses = {}; persist(); render(); toast('All responses cleared');
      }
    }
  });
  document.getElementById('importFile').onchange = function () {
    if (this.files && this.files.length) importFiles(this.files);
    this.value = '';
  };

  document.getElementById('newBtn').onclick = function () { openNew(null); };

  if (SYNC) {
    var liveBtn = document.getElementById('liveBtn');
    liveBtn.hidden = false;
    liveBtn.onclick = function () {
      mode = 'live';
      renderView();
      loadLive();   // always refetch: anything sent since the last look should show
    };
  }

  var hash = decodeURIComponent(location.hash.replace('#', '')).toUpperCase();
  if (hash && EMP.some(function (e) { return e.id === hash; })) currentId = hash;
  render();
  if (!currentId) document.getElementById('q').focus();
})();
</script>
</body>
</html>
